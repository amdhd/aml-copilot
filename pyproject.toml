[project]
name = "aml-copilot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# What the api and worker containers import. Verified by importing both entry
# points and reading sys.modules, not by reasoning about it.
dependencies = [
    "torch>=2.5",
    "torch-geometric>=2.6",
    "pandas>=2.2",
    "numpy>=2.0",
    "psycopg[binary]>=3.3.5",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "arq>=0.28.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "openai>=3.8.0",
    "sentence-transformers>=6.0.1",
    "pgvector>=0.5.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]
# Training, the XGBoost baseline and corpus ingestion. None of it runs on
# Fargate. shap is the expensive one: it drags numba and llvmlite, 143MB that
# no runtime path imports. scikit-learn is here because ml/metrics.py uses it
# directly -- it still reaches the runtime image as a sentence-transformers
# dependency, which is the correct reason for it to be there.
train = [
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "shap>=0.52.0",
    "tensorboard>=2.21.0",
    "pypdf>=6.17.0",
]

[tool.uv]
# Local dev and CI get everything; the image build passes --no-default-groups.
default-groups = ["dev", "train"]

# PyPI's linux torch wheel declares the CUDA runtime as dependencies -- 44
# nvidia-* packages, ~2.5GB -- and Fargate has no GPU (section 8). They never
# install on macOS, so this is invisible in local dev and only lands in the
# image build. Linux resolves from the CPU index instead; macOS stays on PyPI,
# where the wheel is already CPU-only and carries the MPS build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
# Flat layout: the packages are run as `python -m ml.train` from the repo
# root, so the root has to be importable here too.
pythonpath = ["."]
testpaths = ["tests"]
