[project]
name = "aml-copilot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "torch-geometric>=2.6",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "psycopg[binary]>=3.3.5",
    "shap>=0.52.0",
    "tensorboard>=2.21.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "arq>=0.28.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "openai>=3.8.0",
    "sentence-transformers>=6.0.1",
    "pypdf>=6.17.0",
    "pgvector>=0.5.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# Flat layout: the packages are run as `python -m ml.train` from the repo
# root, so the root has to be importable here too.
pythonpath = ["."]
testpaths = ["tests"]
